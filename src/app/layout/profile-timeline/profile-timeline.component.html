<section class="section">
  <h2 class="section-title">Experience</h2>

  <ul class="jobs">
    @for (job of jobs; track job.company) {
      <li class="job">
        <div class="job__head">
          <h3 class="job__role">
            {{ job.role }} at
            @if (job.companyUrl) {
              <a [href]="job.companyUrl" target="_blank" rel="noopener noreferrer">{{ job.company }}</a>
            } @else {
              <span>{{ job.company }}</span>
            }
          </h3>
          <span class="job__period">{{ job.period }}</span>
        </div>
        <p class="job__description">{{ job.description }}</p>
      </li>
    }
  </ul>
</section>
