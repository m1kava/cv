<main class="page">
  <app-profile-card />

  <app-profile-timeline />

  <section class="section">
    <h2 class="section-title">What I work with</h2>
    <ul class="skills">
      @for (skill of skills; track skill) {
        <li>{{ skill }}</li>
      }
    </ul>
  </section>

  <section class="section">
    <h2 class="section-title">Say hi</h2>
    <p class="contact">
      Want to work together or just chat about Angular?
      @if (telegram) {
        Drop me a message on <a [href]="telegram.url" target="_blank" rel="noopener noreferrer">Telegram</a> —
      }
      I'm always happy to connect.
    </p>
  </section>

  <footer class="footer">© {{ year }} {{ profile.name }}</footer>
</main>
